[package]
name = "rmcp"
exclude = ["tests/test_package_license.rs"]
license = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
readme = { workspace = true }
description = "Rust SDK for Model Context Protocol"
documentation = "https://docs.rs/rmcp"

[lints.clippy]
exhaustive_structs = "warn"
exhaustive_enums = "warn"

[package.metadata.docs.rs]
features = [
  "auth",
  "auth-client-credentials-jwt",
  "auth-enterprise-managed",
  "base64",
  "client",
  "client-side-sse",
  "elicitation",
  "macros",
  "request-state",
  "reqwest",
  "reqwest-native-tls",
  "reqwest-tls-no-provider",
  "schemars",
  "server",
  "server-side-http",
  "tower",
  "transport-async-rw",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-client-unix-socket",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
  "transport-worker",
  "uuid",
]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.charon]
# The module request_state_wire is created by formal/trusted/patches/01-request-state-wire.patch,
# applied only to the translated copy (D2 fallback, human decision 2026-11-23); the SDK sources are
# upstream and unchanged.
start_from = [
  "rmcp::model::request_state",
  "rmcp::model::request_state_wire",
  # Phase 2 (plan Sections 15-16): existing upstream functions, unmodified. Inherent methods are
  # reached with the `_` glob (B8); each glob matches exactly one item, which
  # scripts/aeneas-translate.sh checks against translation.json (distinct local `rust_name`s per glob),
  # so a new upstream method of the same name
  # fails the translation instead of entering silently.
  "rmcp::model::_::into_request",            # M01
  "rmcp::model::_::into_response",           # M02
  "rmcp::model::_::into_notification",       # M03
  "rmcp::model::_::into_error",              # M04
  "rmcp::model::_::into_result",             # M05
  "rmcp::model::_::numeric_string_value",    # M06
  "rmcp::model::_::matches_response_id",     # M07
  "rmcp::model::task::_::is_terminal",       # M08
  "rmcp::model::_::into_vec",                # M09
  "rmcp::model::_::is_empty",                # M10
  "rmcp::model::_::len",                     # M11
  "rmcp::model::_::first",                   # M12
  "rmcp::model::_::as_prompt_name",          # M13
  "rmcp::model::_::as_resource_uri",         # M14
  "rmcp::transport::common::client_side_sse::_::check_limit",      # T01
  "rmcp::transport::common::client_side_sse::_::finish_line",      # T02
  "rmcp::transport::common::client_side_sse::_::observe",          # T03
  "rmcp::transport::async_rw::without_carriage_return",            # T04
  "rmcp::transport::async_rw::is_standard_notification",           # T05
  "rmcp::transport::async_rw::is_standard_method",                 # T06
  "rmcp::transport::streamable_http_server::tower::default_port",  # T07
  "rmcp::transport::streamable_http_server::tower::_::matches",    # T08
  "rmcp::transport::auth::_::embedded_ipv4",                       # A01
  "rmcp::transport::auth::_::is_disallowed_metadata_ipv4",         # A02
  "rmcp::transport::auth::_::is_disallowed_metadata_ipv6",         # A03
  # Skills (SEP-2640), public API of skill.rs (human decisions 2026-11-25): K01-K04, K08-K12,
  # K17-K20 translate unmodified (ORIGINAL linkage); K05-K07, K13-K16 need translation patch 04
  # (formal/trusted/patches/04-skill-public.patch). `impl Resource` is written in skill.rs but
  # Charon resolves the glob through the type's module; the `_::new` and `_::with_meta` globs
  # match a fixed list of methods (MULTI in scripts/aeneas-translate.sh).
  "rmcp::model::resource::_::is_directory",  # K01
  "rmcp::model::skill::_::new",  # K02 K04 K08 K10 K17
  "rmcp::model::skill::_::with_directory_read",  # K03
  "rmcp::model::skill::_::from_bytes",  # K05
  "rmcp::model::skill::_::verify",  # K06
  "rmcp::model::skill::sha256_digest",  # K07
  "rmcp::model::skill::_::with_field",  # K09
  "rmcp::model::skill::_::with_meta",  # K11 K20
  "rmcp::model::skill::_::name",  # K12
  "rmcp::model::skill::_::validate",  # K13
  "rmcp::model::skill::skill_name_from_uri",  # K14
  "rmcp::model::skill::is_sha256_digest",  # K15
  "rmcp::model::skill::validate_skills",  # K16
  "rmcp::model::skill::_::with_ttl_ms",  # K18
  "rmcp::model::skill::_::with_cache_scope",  # K19
  # OAuth metadata address policy, metadata_resolver.rs (human decisions 2026-11-25): N01 and N08
  # translate unmodified (ORIGINAL linkage); the others need translation patch 05
  # (formal/trusted/patches/05-metadata-resolver.patch). N02 SystemResolver::resolve (async OS DNS)
  # is not a target; the async shells of resolve and with_lookup are unverified glue.
  "rmcp::transport::auth::metadata_resolver::_::of",  # N01
  "rmcp::transport::auth::metadata_resolver::_::new",  # N03 (patch 05)
  "rmcp::transport::auth::metadata_resolver::_::with_base_url",  # N04 (patch 05)
  "rmcp::transport::auth::metadata_resolver::_::allowed_addresses",  # N09 (patch 05)
  "rmcp::transport::auth::metadata_resolver::_::with_proxy_hosts",  # N05
  "rmcp::transport::auth::metadata_resolver::_::allowing_private_addresses",  # N06
  "rmcp::transport::auth::metadata_resolver::_::allows_url",  # N07
  "rmcp::transport::auth::metadata_resolver::_::is_allowed",  # N08
  "rmcp::transport::auth::metadata_resolver::literal_ip",  # N10
  "rmcp::transport::auth::metadata_resolver::proxy_host",  # N05 helper (patch 05)
  "rmcp::transport::auth::metadata_resolver::normalize_host",  # N11
  # OAuth metadata URL and issuer checks of auth.rs (A04-A10): all need translation patch 06
  # (formal/trusted/patches/06-auth-metadata.patch). A08-A10 start from the patch-06 helpers
  # check_*; their AuthError/&self wrappers (validate_*) are unverified glue.
  "rmcp::transport::auth::_::is_http_url",  # A04 (patch 06)
  "rmcp::transport::auth::_::is_disallowed_metadata_host",  # A05 (patch 06)
  "rmcp::transport::auth::_::is_allowed_metadata_url",  # A06 (patch 06)
  "rmcp::transport::auth::_::resolve_resource_metadata_url",  # A07 (patch 06)
  "rmcp::transport::auth::_::check_authorization_response_issuer",  # A08 (patch 06)
  "rmcp::transport::auth::_::check_authorization_metadata_issuer",  # A09 (patch 06)
  "rmcp::transport::auth::_::check_resource_metadata_resource",  # A10 (patch 06)
  # SEP-2243 header-value encoding of mcp_headers.rs (G01-G04): all need translation patch 07
  # (formal/trusted/patches/07-mcp-headers.patch).
  "rmcp::transport::common::mcp_headers::requires_base64",  # G01 (patch 07)
  "rmcp::transport::common::mcp_headers::is_tchar",  # G02 (patch 07)
  "rmcp::transport::common::mcp_headers::encode_header_value",  # G03 (patch 07)
  "rmcp::transport::common::mcp_headers::decode_header_value",  # G04 (patch 07)
  # Elicitation schema builders of elicitation_schema.rs (X01-X75 in Rust source order; the f64
  # NumberSchema builders are not targets). `Type::method` patterns, which Charon resolves through
  # the type (`_` globs would also reach NumberSchema and other same-named methods). Entries marked
  # (patch 08) need formal/trusted/patches/08-elicitation-schema.patch; the others are ORIGINAL.
  "rmcp::model::elicitation_schema::StringSchema::new",  # X01
  "rmcp::model::elicitation_schema::StringSchema::email",  # X02
  "rmcp::model::elicitation_schema::StringSchema::uri",  # X03
  "rmcp::model::elicitation_schema::StringSchema::date",  # X04
  "rmcp::model::elicitation_schema::StringSchema::date_time",  # X05
  "rmcp::model::elicitation_schema::StringSchema::title",  # X06
  "rmcp::model::elicitation_schema::StringSchema::description",  # X07
  "rmcp::model::elicitation_schema::StringSchema::with_length",  # X08
  "rmcp::model::elicitation_schema::StringSchema::length",  # X09
  "rmcp::model::elicitation_schema::StringSchema::min_length",  # X10
  "rmcp::model::elicitation_schema::StringSchema::max_length",  # X11
  "rmcp::model::elicitation_schema::StringSchema::format",  # X12
  "rmcp::model::elicitation_schema::StringSchema::with_default",  # X13
  "rmcp::model::elicitation_schema::IntegerSchema::new",  # X14
  "rmcp::model::elicitation_schema::IntegerSchema::with_range",  # X15
  "rmcp::model::elicitation_schema::IntegerSchema::range",  # X16
  "rmcp::model::elicitation_schema::IntegerSchema::minimum",  # X17
  "rmcp::model::elicitation_schema::IntegerSchema::maximum",  # X18
  "rmcp::model::elicitation_schema::IntegerSchema::title",  # X19
  "rmcp::model::elicitation_schema::IntegerSchema::description",  # X20
  "rmcp::model::elicitation_schema::IntegerSchema::with_default",  # X21
  "rmcp::model::elicitation_schema::BooleanSchema::new",  # X22
  "rmcp::model::elicitation_schema::BooleanSchema::title",  # X23
  "rmcp::model::elicitation_schema::BooleanSchema::description",  # X24
  "rmcp::model::elicitation_schema::BooleanSchema::with_default",  # X25
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::title",  # X26
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::description",  # X27
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::untitled",  # X28
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::enum_titles",  # X29 (patch 08)
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::new",  # X30
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::multiselect",  # X31
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::with_default",  # X32 X35 (patch 08)
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::build",  # X33 X38 (patch 08)
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::single_select",  # X34
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::min_items",  # X36 (patch 08)
  "rmcp::model::elicitation_schema::EnumSchemaBuilder::max_items",  # X37 (patch 08)
  "rmcp::model::elicitation_schema::EnumSchema::builder",  # X39
  "rmcp::model::elicitation_schema::ElicitationSchema::new",  # X40 (patch 08)
  "rmcp::model::elicitation_schema::ElicitationSchema::with_required",  # X41
  "rmcp::model::elicitation_schema::ElicitationSchema::with_title",  # X42
  "rmcp::model::elicitation_schema::ElicitationSchema::with_description",  # X43
  "rmcp::model::elicitation_schema::ElicitationSchema::with_schema",  # X44
  "rmcp::model::elicitation_schema::ElicitationSchema::builder",  # X45
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::new",  # X46
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::property",  # X47
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_property",  # X48
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::string_property",  # X49
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_string_property",  # X50
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::integer_property",  # X51
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_integer_property",  # X52
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::bool_property",  # X53
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_bool_property",  # X54
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_string",  # X55
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_string",  # X56
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_email",  # X57
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_email",  # X58
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_string_with",  # X59
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_string_with",  # X60
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_integer",  # X61
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_integer",  # X62
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_integer_with",  # X63
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_integer_with",  # X64
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_bool",  # X65
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_bool",  # X66
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_bool_with",  # X67
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_bool_with",  # X68
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::required_enum_schema",  # X69
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::optional_enum_schema",  # X70
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::mark_required",  # X71
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::title",  # X72
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::description",  # X73
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::build",  # X74 (patch 08)
  "rmcp::model::elicitation_schema::ElicitationSchemaBuilder::build_unchecked",  # X75 (patch 08)
]
hide_marker_traits = true
exclude = [
  # B9: the serde facade is out of scope (serde_core, which defines the traits, is opaque below).
  "serde",
  # Section 2.3, B9: the serializing JSON wrappers (Aeneas does not support the mutually
  # recursive serde_core::ser traits) and the Error impl.
  "rmcp::model::request_state::_::seal_json",
  "rmcp::model::request_state::_::seal_json_with",
  "rmcp::model::request_state::{impl core::error::Error for rmcp::model::request_state::RequestStateError}",
  # Section 2.3, B13: Aeneas type assertion / internal error in formatting impls.
  "rmcp::model::request_state::{impl core::fmt::Debug for rmcp::model::request_state::RequestStateError}",
  "rmcp::model::request_state::{impl core::fmt::Display for rmcp::model::request_state::RequestStateError}",
  "rmcp::model::request_state::{impl core::fmt::Debug for rmcp::model::request_state::RequestStateCodec}",
  # Derived Debug; depends on the Aeneas axiom Aeneas.Std.core.fmt.Formatter and native-decide
  # string axioms; not used by any target (human decision 2026-11-22).
  "rmcp::model::request_state::{impl core::fmt::Debug for rmcp::model::request_state::SealOptions}",
  "rmcp::model::request_state::{impl core::fmt::Debug for rmcp::model::request_state::SealMode}",
  "rmcp::model::request_state_wire::{impl core::fmt::Debug for rmcp::model::request_state_wire::KidError}",
  "rmcp::model::request_state_wire::{impl core::fmt::Debug for rmcp::model::request_state_wire::Version}",
  "rmcp::model::request_state_wire::{impl core::fmt::Debug for rmcp::model::request_state_wire::Rs1Parts}",
  "rmcp::model::request_state_wire::{impl core::fmt::Debug for rmcp::model::request_state_wire::Rs2Parts}",
  "rmcp::model::request_state_wire::{impl core::fmt::Debug for rmcp::model::request_state_wire::FrameError}",
]
opaque = [
  # Wraps HMAC and base64 Engine types that cannot be translated (B1, B3); no Rust model to patch in; Lean models: Section 4.
  "rmcp::model::request_state_wire::prim",
  # Reads the system clock (I/O); no Rust model to patch in; Lean model: Section 4. Called by the
  # targets seal_with and seal (since translation patch 03; extended clock rule) and by non-target wrappers.
  "rmcp::model::request_state::_::now_ms",
  # External crates: only signatures are needed; Lean models: Section 4.
  "zeroize", "base64", "hmac", "sha2", "thiserror", "chrono", "serde_json",
  # serde_core: opaque, not excluded, so that the trait DeserializeOwned in the signatures of
  # open_json and open_json_with is translated (formal/trusted/patches/03-request-state-public.patch;
  # human decision 2026-11-24, targets R09-R15); only signatures and trait declarations are needed.
  "serde_core",
  # Phase 2 (plan Section 15): external crates reached by the widened feature list; only
  # signatures are needed, no Phase 2 target body calls into them.
  "http", "tokio", "tokio_util", "tracing", "tracing_core", "futures", "futures_util",
  "futures_core", "bytes", "sse_stream", "hyper", "tower_service", "uuid", "schemars",
  "pin_project_lite", "tokio_stream", "http_body", "http_body_util", "rand", "async_trait",
  "pastey", "oauth2", "reqwest",
  # url: only the type Url is opaque; Host<S> and ParseError are translated from url's source.
  "url::Url",
  # Created by translation patch 05: Lookup wraps the Arc<dyn Resolve> of MetadataAddressResolver
  # (Aeneas: dynamic trait types); prim wraps the OS resolver, the proxy env reads (opaque constant,
  # clock rule) and the str Pattern APIs (B2); Lean models: formal/trusted/Rmcp/FunsExternal.lean.
  "rmcp::transport::auth::metadata_resolver::Lookup",
  "rmcp::transport::auth::metadata_resolver::prim",
  # Created by translation patch 04: one-line wrappers of the str Pattern APIs (B2), SHA-256
  # (B1), NFKC and percent-encoding; Lean models: formal/trusted/Rmcp/FunsExternal.lean.
  "rmcp::model::skill::prim",
  # Created by translation patch 06: one-line wrappers of the str Pattern APIs (B2) and of
  # str::trim, the url rewriting of an issuer (Url::set_query/set_fragment/set_path/to_string) and
  # the four tracing events of resolve_resource_metadata_url; Lean models: FunsExternal.lean.
  "rmcp::transport::auth::prim",
  # Created by translation patch 07: one-line wrappers of the str Pattern APIs (B2), of
  # str::chars().any, of format! and of the base64 engine BASE64_STANDARD (B3); Lean models:
  # formal/trusted/Rmcp/FunsExternal.lean.
  "rmcp::transport::common::mcp_headers::prim",
  # Created by translation patch 08: one-line wrappers of a format! (core::fmt::Arguments is Unit
  # in the Aeneas library) and of BTreeMap::keys().cloned().collect() (Aeneas internal error);
  # Lean models: formal/trusted/Rmcp/FunsExternal.lean.
  "rmcp::model::elicitation_schema::prim",
  # Phase 2, human decision H4: the type only. A01-A03 are associated functions of
  # AuthorizationManager that never use `self`; translating the type makes Charon fail (a hax
  # panic on the fields `Arc<dyn CredentialStore>` and `Arc<dyn StateStore>`, auth.rs:1252-1253;
  # S23 review, 2026-11-24). Opaque, no type declaration is generated; the three function bodies
  # are translated.
  "rmcp::transport::auth::AuthorizationManager",
]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
tracing = { version = "0.1" }
tokio-util = { version = "0.7" }
pin-project-lite = "0.2"
percent-encoding = { version = "2", default-features = false, features = ["alloc"] }
unicode-general-category = "1"
unicode-normalization = { version = "0.1", default-features = false }
pastey = { version = "0.2.0", optional = true }
# oauth2 support
oauth2 = { version = "5.0", optional = true, default-features = false }
# JWT signing for client credentials (private_key_jwt)
jsonwebtoken = { version = "11", optional = true, features = ["aws_lc_rs"] }

# for auto generate schema
schemars = { version = "1.0", optional = true, features = ["chrono04"] }

# for image encoding
base64 = { version = "0.23", optional = true }

# SHA-256 for SEP-2640 skill digests and SEP-2322 requestState sealing
sha2 = "0.11"

# SKILL.md frontmatter for the `skills-fs` catalog
yaml_serde = { version = "0.10", optional = true }
# reads the `skills-fs` catalog through a root handle that cannot escape it
cap-std = { version = "4", optional = true }
cap-fs-ext = { version = "4", optional = true }

# for SEP-2322 requestState integrity sealing (opt-in via the `request-state` feature)
hmac = { version = "0.13", optional = true }
zeroize = { version = "1", optional = true }

# for HTTP client
reqwest = { version = "0.13.2", default-features = false, features = [
  "json",
  "stream",
], optional = true }

sse-stream = { version = "0.2.4", optional = true }

http = { version = "1", optional = true }
url = { version = "2.4", optional = true }

# For tower compatibility
tower-service = { version = "0.3", optional = true }

# for child process transport
process-wrap = { version = "10.0", features = ["tokio1"], optional = true }

# for cross-platform executable path resolution
which = { version = "8", optional = true }

# for ws transport
# tokio-tungstenite ={ version = "0.26", optional = true }

# for http-server transport
rand = { version = "0.10", optional = true }
tokio-stream = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

# for unix socket transport
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

# macro
rmcp-macros = { workspace = true, optional = true }
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
chrono = { version = "0.4.38", default-features = false, features = [
  "serde",
  "clock",
  "std",
  "oldtime",
] }

# the stdio pipe transport reopens `/proc/self/fd` with `O_NONBLOCK`;
# the child process transport sends `SIGTERM` during graceful shutdown
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"], optional = true }

[features]
default = ["base64", "macros", "server"]
local = ["rmcp-macros?/local"]
client = ["dep:tokio-stream"]
server = ["transport-async-rw", "schemars", "dep:pastey", "uuid"]
macros = ["dep:rmcp-macros", "dep:pastey"]
elicitation = ["dep:url"]

# SEP-2322 requestState integrity helper (HMAC-SHA256 seal/open codec)
request-state = ["dep:hmac", "dep:zeroize", "base64"]
skills-fs = ["server", "base64", "dep:cap-std", "dep:cap-fs-ext", "dep:yaml_serde", "dep:windows-sys"]

# reqwest http client
__reqwest = ["dep:reqwest"]

reqwest = ["__reqwest", "reqwest?/rustls"]

reqwest-tls-no-provider = ["__reqwest", "reqwest?/rustls-no-provider"]

reqwest-native-tls = ["__reqwest", "reqwest?/native-tls"]

server-side-http = [
  "uuid",
  "dep:rand",
  "dep:tokio-stream",
  "dep:http",
  "dep:http-body",
  "dep:http-body-util",
  "dep:bytes",
  "dep:sse-stream",
  "tower",
  "base64",
]

transport-worker = ["dep:tokio-stream"]

# SSE stream parsing utilities (used by streamable HTTP client for SSE-formatted responses)
client-side-sse = ["dep:sse-stream", "dep:http", "dep:bytes", "base64"]

# Streamable HTTP client
transport-streamable-http-client = ["client-side-sse", "transport-worker"]
transport-streamable-http-client-reqwest = ["transport-streamable-http-client", "__reqwest"]
transport-streamable-http-client-unix-socket = [
  "transport-streamable-http-client",
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:http",
  "dep:bytes",
  "tokio/net",
]

transport-async-rw = ["tokio/io-util", "tokio-util/codec"]
transport-io = ["transport-async-rw", "tokio/io-std", "tokio/net"]
transport-child-process = [
  "transport-async-rw",
  "tokio/process",
  "dep:process-wrap",
]
which-command = [
  "transport-child-process",
  "dep:which",
]
transport-streamable-http-server = [
  "transport-streamable-http-server-session",
  "server-side-http",
  "transport-worker",
]
transport-streamable-http-server-session = [
  "transport-async-rw",
  "dep:async-trait",
  "dep:tokio-stream",
]
# transport-ws = ["transport-io", "dep:tokio-tungstenite"]
tower = ["dep:tower-service"]
auth = ["dep:async-trait", "dep:oauth2", "__reqwest", "dep:url"]
auth-client-credentials-jwt = ["auth", "dep:jsonwebtoken", "uuid"]
auth-enterprise-managed = ["auth", "base64"]
schemars = ["dep:schemars"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
schemars = { version = "1.1.0", features = ["chrono04"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
url = "2.4"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "std",
  "fmt",
] }
async-trait = "0.1"
rstest = "0.28.0"
tempfile = "3"
# Cargo unifies this feature into rmcp whenever any crate in a build enables it,
# so the tests run with it on (see tests/test_deserialization.rs).
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
