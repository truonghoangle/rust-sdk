# Lean project for the request-state verification (plan Section 5, "Lean libraries").
#
# The Aeneas `rev` below is the single source of truth for the toolchain:
# scripts/aeneas-install.sh reads it and installs the matching Charon, Aeneas,
# Rust nightly and Lean toolchain (copied to lean-toolchain). Changing it is its
# own PR (formal/CONTRIBUTING.md, "Pinned toolchain").

name = "rmcp_formal"
# Build gate (human decision at S03): every library below sets `warningAsError`, and
# CI runs `lake build --wfail`, so any warning in this project's own modules (including
# `declaration uses 'sorry'`) or replayed from a dependency fails the build. (Up to Aeneas
# nightly-2026.08.20-5d08da4 the Aeneas library had four `sorry` warnings and a plain
# `lake build` was the gate; nightly-2026.11.24-fb44cb4 has none.)
# scripts/lean-guard.sh (scripts/lean_guard.py) parses this file and fails CI unless it
# has exactly the five libraries below, with these srcDirs and roots, each with exactly
# the keys name/srcDir/roots/leanOptions and `leanOptions = { warningAsError = true }`
# (for `Rmcp` and `RmcpExternal` exactly `{ warningAsError = true, autoImplicit = false }`),
# and no other package-level key than name, defaultTargets, require and lean_lib; it also
# fails if a lakefile.lean exists or a source file switches the option off.
# `Rmcp` and `RmcpExternal` are not default targets; `lake build Rmcp RmcpExternal`
# builds them. Since the audit-scope decision (2026-11-23) the unused placeholder
# externals no longer block adding them: with both here, `lake build` and the
# `sources`, `build-log` and `axioms` checks pass (the S03 evidence (git history at 223ff12), D1).
# Adding them is the lead's decision; until then `lake build` builds only the
# hand-maintained roots, and Rmcp is audited only once a Defs/Proofs/Specs module
# imports Rmcp.Funs (S06).
defaultTargets = ["Defs", "Proofs", "Specs"]

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "nightly-2026.11.24-fb44cb4"
subDir = "backends/lean"

# Generated by Aeneas (scripts/aeneas-translate.sh); never edited by hand.
# The roots list each generated module exactly. A bare `Rmcp` root would claim
# every `Rmcp.*` module, including `Rmcp.TypesExternal`/`Rmcp.FunsExternal` of
# `RmcpExternal`. Aeneas (with -split-files -subdir Rmcp) generates no `Rmcp.lean`.
# `autoImplicit = false` (human decision XD3, 2026-11-28): a name the translation uses but
# nothing defines is an error, not an automatically bound implicit variable (the pinned
# Aeneas prints Rust's f32/f64 as `F32`/`F64` without defining them; they are now defined
# in trusted/Rmcp/TypesExternal.lean). scripts/lean_guard.py allows this one extra option
# for this library and `RmcpExternal` (XD9) only.
[[lean_lib]]
name = "Rmcp"
leanOptions = { warningAsError = true, autoImplicit = false }
srcDir = "translation"
roots = ["Rmcp.Types", "Rmcp.Funs"]

# Hand-written externals, opaque functions and axioms (trusted base).
# `autoImplicit = false` (human decision XD9, 2026-11-28): as for `Rmcp`, an undefined name in a
# trusted model is a build error, not an automatically bound implicit variable.
[[lean_lib]]
name = "RmcpExternal"
leanOptions = { warningAsError = true, autoImplicit = false }
srcDir = "trusted"
roots = ["Rmcp.TypesExternal", "Rmcp.FunsExternal"]

# Definitions used by spec statements. Only modules imported from Defs.lean are built.
[[lean_lib]]
name = "Defs"
leanOptions = { warningAsError = true }
srcDir = "specs"
roots = ["Defs"]

# Proofs and consistency models. Only modules imported from Proofs.lean are built.
[[lean_lib]]
name = "Proofs"
leanOptions = { warningAsError = true }
srcDir = "proofs"
roots = ["Proofs"]

# Spec files (`recall` + `#guard_msgs` axiom checks). Only modules imported from
# Specs.lean are built. specs/Drafts/ belongs to no library.
[[lean_lib]]
name = "Specs"
leanOptions = { warningAsError = true }
srcDir = "specs"
roots = ["Specs"]
